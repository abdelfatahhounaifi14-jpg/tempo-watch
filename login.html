
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة - TEMPO WATCH</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: #222;
            padding: 35px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            border: 1px solid #c9a227;
        }

        h2 {
            color: #d4af37;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #777;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            color: #ff7777;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>TEMPO WATCH</h2>
        <p>تسجيل الدخول للإدارة</p>

        <form id="loginForm">
            <input
                type="password"
                id="password"
                placeholder="أدخل كلمة المرور"
                required
            >
            <button type="submit">دخول</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        const ADMIN_PASSWORD = "Tempo2026";

        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;

            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem("tempoAdminLoggedIn", "true");
                window.location.href = "products.html";
            } else {
                document.getElementById("message").textContent =
                    "كلمة المرور غير صحيحة.";
            }
        });
    </script>
</body>
</html>
